[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

; Loads WiFi credentials & location from the git-ignored .env file and
; injects them as -D build flags before compilation.
extra_scripts = pre:load_env.py
; DO NOT set board_build.f_cpu — the SSD1677 needs the default 240 MHz SPI timing.
; At 80 MHz the display refresh fails silently.

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    zinggjm/GxEPD2 @ ^1.6.5
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.4.2
